<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B6CFF">
<title>校园信息墙 · 失物招领 · 二手转让 · 拼单</title>
<style>
  :root{
    --bg:#F1F2F4; --card:#fff; --ink:#1B1E23; --sub:#8B9099; --line:#EAECEF;
    --p1:#2C6BE0; --p2:#2C6BE0;
    --lost:#D9622B; --lost-bg:#FBF0EA; --sell:#2C6BE0; --sell-bg:#EDF2FC;
  --pin:#1E8A5F; --pin-bg:#EAF6EF;
    --price:#E24B2E;
    --ok:#1F9254; --warn:#8A9099;
    --r:6px;
    --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:56px;position:relative;background:var(--bg)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea,select{font:inherit}

  /* ---------- 通用按钮 ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 14px;border-radius:5px;
       font-size:14px;font-weight:500;background:var(--p1);color:#fff;transition:opacity .12s}
  .btn:active{opacity:.82}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid #DCDFE4}
  .btn.line{background:#fff;color:#333;border:1px solid #DCDFE4}
  .btn.danger{background:#fff;color:#D93A2B;border:1px solid #E9B6AF}
  .btn.sm{height:29px;padding:0 10px;font-size:12.5px;border-radius:4px}
  .btn.wide{width:100%;height:44px;border-radius:5px;font-size:15px}

  /* ---------- 顶部 ---------- */
  .hero{padding:0 0 6px;background:var(--bg)}
  .hero-in{position:relative;background:#fff;padding:12px 12px 0;border-bottom:1px solid var(--line)}
  .hero-top{display:flex;align-items:center;gap:8px}
  .hero-top .nm{font-size:17px;font-weight:600;letter-spacing:0;color:#17191D}
  .hero-top .sp{flex:1}
  .hero-sub{font-size:12px;color:var(--sub);margin-top:4px}
  .pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:4px;
        background:#fff;border:1px solid #E3E6EA;font-size:12.5px;color:#4A5058}
  .srch{margin-top:10px;display:flex;align-items:center;gap:7px;background:#F4F5F7;border:1px solid #EDEFF2;border-radius:5px;padding:0 10px;height:36px}
  .srch svg{flex:0 0 auto;opacity:.42}
  .srch input{flex:1;border:0;outline:none;background:none;font-size:14px;color:var(--ink);min-width:0}
  .tabs{display:flex;gap:0;margin-top:8px;background:none;padding:0;border:0;border-bottom:0}
  .tab{flex:1;height:38px;border-radius:0;font-size:14px;font-weight:400;color:#5E646D;position:relative}
  .tab.on{color:#17191D;font-weight:600}
  .tab.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:26px;height:2px;background:var(--p1);border-radius:2px}
  .notice{margin:0 -12px;padding:7px 12px;background:#FCFCFD;border-top:1px solid var(--line);font-size:11.5px;color:#9AA0A8;line-height:1.6}

  /* ---------- 普通页头 ---------- */
  .hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
  .hd-in{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .hd-in .ttl{font-weight:600;font-size:15.5px}
  .grow{flex:1}

  /* ---------- 列表 ---------- */
  .list{padding:0;background:#fff;display:block}
  .card{position:relative;background:#fff;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;
        padding:12px;display:flex;gap:10px;align-items:flex-start;transition:none}
  .thumb{position:relative;width:64px;height:64px;border-radius:4px;flex:0 0 auto;overflow:hidden;display:grid;place-items:center;font-size:22px;
         background:#F2F3F5;border:1px solid #EFF0F2}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .thumb svg{width:22px;height:22px;color:#CBCFD6}
  .c-main{flex:1;min-width:0}
  .c-top{display:flex;align-items:center;gap:5px;margin-bottom:3px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:500;line-height:1.6;padding:1px 5px;border-radius:2px;letter-spacing:0;border:1px solid transparent}
  .tag.lost{color:var(--lost);background:var(--lost-bg);border-color:#F3DDD0}
  .tag.sell{color:var(--sell);background:var(--sell-bg);border-color:#DEE8F9}
  .tag.done{color:#6B7079;background:#F1F2F4;border-color:#E9EBEE}
.tag.pin{color:var(--pin);background:var(--pin-bg);border-color:#D9EDE1}
.pin-box{margin:10px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#FAFBFC}
.pin-top{display:flex;justify-content:space-between;font-size:12.5px;color:#3A4250;margin-bottom:7px}
.pin-top b{color:var(--pin);font-weight:600}
.bar{height:6px;border-radius:3px;background:#EDEFF3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pin);border-radius:3px}
.pin-sub{margin-top:6px;font-size:11.5px;color:#8A929F}
  .c-title{font-size:15px;font-weight:400;line-height:1.45;color:#22262B;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .c-meta{margin-top:5px;font-size:12px;color:#9AA0A8;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .c-meta i{font-style:normal}
  .fav-mini{margin-left:auto;height:23px;padding:0 8px;border-radius:3px;background:#fff;border:1px solid #DFE3E8;color:#5E646D;
            font-size:11.5px;font-weight:400;white-space:nowrap}
  .fav-mini:active{background:#F4F5F7}
  .price{margin-left:auto;font-weight:600;font-size:15px;color:var(--price);white-space:nowrap}
  .empty{text-align:center;padding:56px 24px;color:#9AA0A8;font-size:13.5px;line-height:1.9}
  .empty .ic{font-size:30px;display:block;margin-bottom:10px;opacity:.35}
  .sec-t{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-size:12.5px;font-weight:400;color:#8B9099;letter-spacing:0;text-transform:none;background:var(--bg)}

  /* ---------- 详情 ---------- */
  .wrap{padding:0 0 8px}
  .panel{background:#fff;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px 12px}
  .cover{position:relative;border-radius:0;overflow:hidden;margin-bottom:8px;background:#FAFBFC;border-bottom:1px solid var(--line)}
  .cover img{display:block;width:100%;max-height:300px;object-fit:contain;background:#FAFBFC}
  .d-title{font-size:17px;font-weight:600;line-height:1.45;margin:6px 0 0;color:#17191D}
  .d-price{margin-top:6px;font-weight:600;font-size:20px;color:var(--price)}
  .d-imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
  .d-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:#F2F3F5}
  .d-desc{margin-top:12px;font-size:14.5px;color:#3A3F45;white-space:pre-wrap;line-height:1.75}
  .kv{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#5E646D}
  .kv div{display:flex;gap:10px}
  .kv span:first-child{width:58px;color:#9AA0A8;flex:0 0 auto}
  .contact-box{margin-top:14px;background:#FAFBFC;border:1px solid #E9EBEE;border-radius:4px;padding:12px;text-align:center}
  .contact-box .num{font-size:16px;font-weight:600;margin:4px 0 10px;word-break:break-all}
  .bar-b{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:520px;margin:0 auto;z-index:30}
  .fav-btn{width:48px;height:42px;border-radius:4px;border:1px solid #DCDFE4;background:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
  .fav-btn.on{background:#FDF2F0;border-color:#F2CFC7}

  /* ---------- 表单 ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:400;color:#5E646D;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;border:1px solid #DCDFE4;border-radius:4px;background:#fff;padding:10px 11px;font-size:14.5px;outline:none}
  .field textarea{min-height:96px;resize:vertical;line-height:1.7}
  .field input:focus,.field textarea:focus{border-color:#9DB6E8;box-shadow:0 0 0 3px rgba(44,107,224,.08)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;height:40px;border-radius:4px;border:1px solid #DCDFE4;background:#fff;font-size:14px;font-weight:400;color:#5E646D}
  .seg button.on.lost{border-color:#D9622B;color:#C25521;background:#FBF0EA}
  .seg button.on.sell{border-color:#2C6BE0;color:#2459BC;background:#EDF2FC}
  .up{display:flex;gap:8px;flex-wrap:wrap}
  .up label{width:68px;height:68px;border-radius:4px;border:1px dashed #D3D7DD;display:grid;place-items:center;font-size:20px;color:#A6ACB5;background:#FAFBFC;cursor:pointer;position:relative;overflow:hidden}
  .up label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .up input{display:none}
  .hint{font-size:12px;color:#9AA0A8;margin-top:6px;line-height:1.7}

  /* ---------- 账号 ---------- */
  .auth{padding:14px 12px}
  .auth .box{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:none;padding:18px}
  .auth h2{margin:0 0 4px;font-size:18px;font-weight:600}
  .auth .sb{color:#9AA0A8;font-size:12.5px;margin:0 0 16px}
  .switch{display:flex;background:#F2F3F5;border-radius:4px;padding:3px;margin-bottom:16px}
  .switch button{flex:1;height:32px;border-radius:3px;font-size:13.5px;font-weight:400;color:#5E646D}
  .switch button.on{background:#fff;color:#17191D;font-weight:600;border:1px solid #E4E6EA}
  .avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:500;color:#404652;
          background:#EAEDF1;border:1px solid #E1E4E9}

  /* ---------- 后台 ---------- */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 12px 8px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px}
  .kpi .n{font-size:23px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;color:#17191D}
  .kpi .l{font-size:12px;color:#8B9099;margin-top:1px}
  .kpi.hl{background:#fff;color:#17191D;border:1px solid var(--line)}
  .kpi.hl .n{color:var(--p1)}
  .kpi.hl .l{color:#8B9099}
  .frow{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12.5px}
  .frow .lb{width:64px;color:#5E646D;flex:0 0 auto}
  .frow .tr{flex:1;height:18px;background:#F1F2F4;border-radius:2px;overflow:hidden}
  .frow .fl{height:100%;border-radius:2px;background:#5B8AE0;transition:width .4s}
  .frow .vl{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:#3A3F45;font-weight:500;flex:0 0 auto}
  .trend{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:8px}
  .trend i{flex:1;background:#D5DEEF;border-radius:1px 1px 0 0;min-height:2px;position:relative}
  .trend i.hi{background:#4C7FD6}
  .tlabels{display:flex;gap:3px;margin-top:5px;font-size:9px;color:#A6ACB5}
  .tlabels span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:#8B9099;font-weight:400;font-size:11.5px;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFC}
  td{padding:8px 4px;border-bottom:1px solid #F1F2F4;font-variant-numeric:tabular-nums;color:#3A3F45}
  tr:last-child td{border-bottom:0}
  .row-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding:0 12px}
  .admin .hint{padding-left:12px;padding-right:12px}
  .row2{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .acts{display:flex;flex-direction:column;gap:5px;margin-left:2px}
  .acts .btn{height:26px;font-size:12px;padding:0 9px;border-radius:4px}

  /* ---------- 底部导航 ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;
       border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;color:#8B9099;font-weight:400}
  .nav a .ic{font-size:17px;line-height:1;display:grid;place-items:center;height:22px}
  .nav a .ic svg{width:22px;height:22px;display:block}
  .nav a.on{color:var(--p1)}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(28,30,34,.9);color:#fff;
         font-size:13px;padding:9px 16px;border-radius:4px;opacity:0;transition:.2s;pointer-events:none;z-index:99;white-space:nowrap;max-width:88vw}
  .toast.on{opacity:1}
  .note{font-size:11.5px;color:#9AA0A8;background:#FAFBFC;border:1px solid #EFF0F2;border-radius:4px;padding:9px 11px;line-height:1.7;margin-top:10px}

  .contact-box .who-row{display:flex;align-items:center;gap:10px;text-align:left}
  .contact-box .ava{width:38px;height:38px;border-radius:50%;background:#EDF0F5;color:#5B6472;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:0 0 38px}
  .contact-box .who-main{min-width:0}
  .contact-box .who-name{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .contact-box .who-name .ok{font-size:10.5px;font-weight:500;color:#1E8A5F;background:#EAF6EF;
    border:1px solid #D9EDE1;border-radius:3px;padding:1px 5px}
  .contact-box .who-sub{font-size:11.5px;color:#98A1B2;margin-top:3px}
  .contact-box .c-line{margin-top:12px;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.4px}
  .contact-box .c-line.muted{font-size:12.5px;font-weight:400;color:#98A1B2}
  .contact-box .btn.ghost{margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
 * 校园信息墙 v2 · 单文件全栈前端（离线可跑）
 * 账号 / 收藏 / 我的发布 / 管理员后台 / 埋点 / 渠道归因
 *
 * 关于"账号"：这是纯前端实现，账号、收藏、帖子都存在本机
 * localStorage 里，换设备不同步。它满足的是"同一台设备上，
 * 不同人登录看到各自的数据"，不是真正的服务端账号。
 * 真要做跨设备，只需要把下面 DB 的三个方法换成 fetch 接口，
 * 视图层一行都不用改（见 DB 注释）。
 * ============================================================ */

/* ---------- 存储层（换后端只改这里） ---------- */
var DB = {
  key: function(k){ return 'ciw4_' + k; },
  get: function(k, d){
    try { var v = localStorage.getItem(DB.key(k)); return v ? JSON.parse(v) : d; }
    catch(e){ return d; }
  },
  set: function(k, v){
    try { localStorage.setItem(DB.key(k), JSON.stringify(v)); return true; }
    catch(e){ toast('本地存储已满，删掉几张图片再试'); return false; }
  },
  /* 接入后端时，把 get/set 换成：
     get: async (k) => (await fetch('/api/' + k)).json()
     set: async (k, v) => fetch('/api/' + k, {method:'POST', body: JSON.stringify(v)})
     上层代码不用动。 */
};

/* ---------- 简易哈希（非安全，仅演示；真实项目请用服务端 bcrypt） ---------- */
function hash(s){
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return (h >>> 0).toString(16) + '_' + s.length;
}

/* ---------- 状态 ---------- */
var state = {
  users: DB.get('users', null),
  session: DB.get('session', null),
  items: DB.get('items', null),
  favs: DB.get('favs', {}),
  events: DB.get('events', []),
  ch: DB.get('ch', null)
};

var qs = new URLSearchParams(location.search);
if (qs.get('ch')){ state.ch = String(qs.get('ch')).slice(0,20); DB.set('ch', state.ch); }
if (!state.ch){ state.ch = 'direct'; DB.set('ch', state.ch); }

/* 首次进入：建管理员账号 + 演示内容 */
if (!state.users){
  state.users = [
    { id:'u_admin', nick:'admin', sid:'2020010101', pass:hash('admin123'), role:'admin', createdAt:Date.now() }
  ];
  DB.set('users', state.users);
}
if (!state.items){ state.items = seedItems(); DB.set('items', state.items); }

function saveUsers(){ DB.set('users', state.users); }
function saveItems(){ DB.set('items', state.items); }
function saveFavs(){ DB.set('favs', state.favs); }
function saveEvents(){ DB.set('events', state.events); }

/* ---------- 当前用户 ---------- */
function me(){ 
  if (!state.session) return null;
  for (var i=0;i<state.users.length;i++) if (state.users[i].id === state.session) return state.users[i];
  return null;
}
function isAdmin(){ var u = me(); return !!(u && u.role === 'admin'); }

/* ---------- 收藏（按账号存，一人一条只算一次） ---------- */
function myFavs(){ var u = me(); return u ? (state.favs[u.id] || []) : []; }
function isFav(id){ return myFavs().indexOf(id) >= 0; }
function toggleFav(id){
  var u = me(); if (!u) return false;
  var arr = state.favs[u.id] || (state.favs[u.id] = []);
  var i = arr.indexOf(id);
  if (i >= 0){ arr.splice(i,1); }
  else { arr.unshift(id); }
  state.favs[u.id] = arr;
  saveFavs();
  return i < 0;
}
function favCount(id){
  var n = 0;
  for (var k in state.favs){ if (state.favs[k].indexOf(id) >= 0) n++; }
  return n;
}

/* ---------- 埋点 ---------- */
function track(ev, id){
  var u = me();
  state.events.push({ t:Date.now(), ev:ev, id:id||'', uid:u?u.id:'guest', ch:state.ch });
  if (state.events.length > 20000) state.events = state.events.slice(-20000);
  saveEvents();
}

/* ---------- 工具 ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function ago(t){
  var d = Date.now() - t;
  if (d < 60e3) return '刚刚';
  if (d < 3600e3) return Math.floor(d/60e3) + ' 分钟前';
  if (d < 86400e3) return Math.floor(d/3600e3) + ' 小时前';
  if (d < 7*86400e3) return Math.floor(d/86400e3) + ' 天前';
  var x = new Date(t); return (x.getMonth()+1) + '月' + x.getDate() + '日';
}
function dayKey(t){ var d = new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function fmtUntil(t){
  var d = new Date(t), n = new Date();
  var hm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  if (dayKey(t) === dayKey(n.getTime())) return '今天 ' + hm;
  if (dayKey(t) === dayKey(n.getTime() + 86400e3)) return '明天 ' + hm;
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;
}
var toastTimer;
function toast(msg){
  var el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
}
function go(h){ location.hash = h; }
function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }

/* ---------- 初始内容（30 条）

/* 把种子内容的发布时间打散到 9 月 1 日至今，而不是全挤在"今天"。
   规则：约 1/6 落在最近 48 小时（保证首页有"几小时前"的新内容、今日新增不为 0），
   其余在 9/1 到今天之间均匀随机，小时数也随机，看起来像真实使用了一整个学期。
   想往后延就把 SEED_FROM 往前提、或等真实日期走过 12 月后自然覆盖。 */
function spreadDates(list){
  var end = Date.now();
  var start = new Date(2026, 8, 1).getTime();          // 2026-09-01
  var tail = end - 7 * 86400e3;                        // 最近 7 天单独安排
  var span = Math.max(86400e3, tail - start);
  list.forEach(function(it, i){
    var t;
    if (i % 24 === 0){
      t = end - Math.random() * 1.5 * 86400e3;               // 最近一天半，约 5 条
    } else if (i % 24 === 1){
      t = end - (1.5 + Math.random() * 4.5) * 86400e3;       // 1 天半到 6 天，约 5 条
    } else {
      t = start + Math.random() * span;                      // 9 月以来均匀分布
    }
    it.createdAt = Math.floor(t);
  });
  return list;
}

function thumbHtml(it){

  var img = src ? '<img src="'+esc(src)+'" alt="" loading="lazy" onerror="this.remove()">' : '';
  return '<div class="thumb">'+ico('image')+img+'</div>';

function sidMask(sid){
  sid = String(sid || '');
  if (sid.length < 8) return '';
  return sid.slice(0, 4) + '****' + sid.slice(-2);
}
/* 种子内容没有真实账号，按 ownerId 推一个稳定的学号；真实用户直接取自己的学号 */
function authorSid(it){
  for (var i = 0; i < state.users.length; i++){
    if (state.users[i].id === it.ownerId && state.users[i].sid) return sidMask(state.users[i].sid);
  }
  var h = 0, k = String(it.ownerId || it.id || 'x');
  for (var j = 0; j < k.length; j++) h = (h * 31 + k.charCodeAt(j)) % 99991;
  return (2021 + h % 4) + '****' + ('0' + h % 100).slice(-2);
}
/* 手机号中间四位打码；不是手机号就原样返回 */
function maskContact(c){
  c = String(c || '');
  var m = c.match(/(1[3-9]\d)\d{4}(\d{4})/);
  return m ? c.replace(m[0], m[1] + '****' + m[2]) : c;
}

function viewAdmin(){
  if (!isAdmin()){
    return '<div class="hd"><div class="hd-in"><div class="ttl">数据后台</div></div></div>' +
      '<div class="empty"><span class="ic">🔒</span>这个页面只有管理员能看<br>' +
      '<button class="btn sm" style="margin-top:14px" data-act="to-admin-login">用管理员账号登录</button></div>';
  }
  var totalItems = state.items.length;
  var openItems = state.items.filter(function(x){ return x.status==='open'; }).length;
  var doneItems = totalItems - openItems;
  var views = 0, contacts = 0;
  state.items.forEach(function(x){ views += x.views||0; contacts += x.contacts||0; });

  var evCount = { view_home:0, view_item:0, click_contact:0, publish:0, fav:0 };
  state.events.forEach(function(e){ if (evCount[e.ev] != null) evCount[e.ev]++; });

  var top = evCount.view_home;
  var mid = evCount.view_item;
  var ct  = evCount.click_contact;
  var bot = doneItems;
  var funnel = [['进入首页',top],['查看详情',mid],['发起联系',ct],['完成/找回',bot]];
  var fmax = Math.max.apply(null, funnel.map(function(x){ return x[1]; })) || 1;

  var byCh = {};
  state.events.forEach(function(e){
    var c = e.ch || 'direct';
    if (!byCh[c]) byCh[c] = { uv:{}, ev:0, pub:0, contact:0, fav:0 };
    byCh[c].uv[e.uid] = 1; byCh[c].ev++;
    if (e.ev === 'publish') byCh[c].pub++;
    if (e.ev === 'click_contact') byCh[c].contact++;
    if (e.ev === 'fav') byCh[c].fav++;
  });
  var chRows = Object.keys(byCh).map(function(c){
    var o = byCh[c];
    return { c:c, uv:Object.keys(o.uv).length, ev:o.ev, pub:o.pub, contact:o.contact, fav:o.fav };
  }).sort(function(a,b){ return b.uv - a.uv; });

  var days = [], buckets = {};
  for (var i = 13; i >= 0; i--){
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    var k = dayKey(d.getTime());
    days.push({ k:k, label:(d.getMonth()+1)+'/'+d.getDate(), n:0 });
    buckets[k] = 0;
  }
  state.events.forEach(function(e){ var k = dayKey(e.t); if (buckets[k] != null) buckets[k]++; });
  days.forEach(function(d){ d.n = buckets[d.k]; });
  var dmax = Math.max.apply(null, days.map(function(d){ return d.n; })) || 1;

  var trend = days.map(function(d){
    var h = Math.max(3, Math.round(d.n / dmax * 92));
    return '<i class="'+(d.n === dmax && dmax > 1 ? 'hi' : '')+'" style="height:'+h+'px" title="'+d.label+'：'+d.n+'"></i>';
  }).join('');
  var tlabels = days.map(function(d){ return '<span>'+d.label+'</span>'; }).join('');

  var favTotal = 0;
  for (var kk in state.favs) favTotal += state.favs[kk].length;

  return '<div class="hd"><div class="hd-in">' +
      '<button class="btn ghost sm" data-act="back">‹ 返回</button><div class="grow"></div>' +
      '<div class="ttl">运营数据后台</div></div></div>' +
    '<div class="wrap admin">' +
      '<div class="kpis">' +
        '<div class="kpi hl"><div class="n">'+totalItems+'</div><div class="l">累计发布</div></div>' +
        '<div class="kpi"><div class="n">'+mid+'</div><div class="l">详情浏览</div></div>' +
        '<div class="kpi"><div class="n">'+ct+'</div><div class="l">联系点击</div></div>' +
        '<div class="kpi"><div class="n">'+pct(ct, mid)+'%</div><div class="l">联系转化率</div></div>' +
        '<div class="kpi"><div class="n">'+pct(doneItems, totalItems)+'%</div><div class="l">解决率</div></div>' +
        '<div class="kpi"><div class="n">'+state.users.length+'</div><div class="l">注册用户</div></div>' +
        '<div class="kpi"><div class="n">'+favTotal+'</div><div class="l">收藏总数</div></div>' +
        '<div class="kpi"><div class="n">'+state.events.length+'</div><div class="l">埋点事件</div></div>' +
      '</div>' +

      '<div class="sec-t">转化漏斗</div>' +
      '<div class="panel">' +
        funnel.map(function(f){
          return '<div class="frow"><div class="lb">'+f[0]+'</div>' +
            '<div class="tr"><div class="fl" style="width:'+Math.max(2, Math.round(f[1]/fmax*100))+'%"></div></div>' +
            '<div class="vl">'+f[1]+'</div></div>';
        }).join('') +
        '<div class="hint">看哪一步掉得最多，那就是下一个要改的地方。</div>' +
      '</div>' +

      '<div class="sec-t">近 14 天事件趋势</div>' +
      '<div class="panel"><div class="trend">'+trend+'</div><div class="tlabels">'+tlabels+'</div></div>' +

      '<div class="sec-t">渠道效果</div>' +
      '<div class="panel"><table><thead><tr><th>渠道</th><th>访客</th><th>事件</th><th>发布</th><th>联系</th><th>收藏</th></tr></thead><tbody>' +
        (chRows.length ? chRows.map(function(r){
          return '<tr><td>'+esc(r.c)+'</td><td>'+r.uv+'</td><td>'+r.ev+'</td><td>'+r.pub+'</td><td>'+r.contact+'</td><td>'+r.fav+'</td></tr>';
        }).join('') : '<tr><td colspan="6" style="color:#A3ABB9">还没有带渠道的数据</td></tr>') +
      '</tbody></table>' +
      '<div class="hint">分享时带上 ?ch=朋友圈 这样的参数，就能看出哪个渠道真的带来了人和内容。</div></div>' +

      '<div class="row-btns">' +
        '<button class="btn line sm" data-act="export-ev">导出埋点 CSV</button>' +
        '<button class="btn line sm" data-act="export-item">导出内容 CSV</button>' +
        '<button class="btn line sm" data-act="seed-demo">重算历史事件</button>' +
        '<button class="btn danger sm" data-act="clear-demo">清空全部内容</button>' +
      '</div>' +
      '<div class="hint" style="padding-bottom:26px">这里的数字都来自埋点事件，导出 CSV 可以在 Excel 里做二次分析。清空后不可恢复，慎点。</div>' +
    '</div>';
}

/* ============================================================
 * 渲染
 * ============================================================ */
function render(){
  var h = route();
  var app = $('#app');
  var oldScroll = window.scrollY;
  var keepScroll = (h === '/') ; 

  if (h.indexOf('/item/') === 0) app.innerHTML = viewItem(h.slice(6));
  else if (h === '/publish') app.innerHTML = viewPublish();
  else if (h === '/mine') app.innerHTML = viewMine();
  else if (h === '/favs') app.innerHTML = viewFavs();
  else if (h === '/admin') app.innerHTML = viewAdmin();
  else if (h === '/login') app.innerHTML = viewAuth();
  else app.innerHTML = viewHome();

  var isDetail = h.indexOf('/item/') === 0;
  var isAuth = h === '/login';
  if (!isDetail && !isAuth) app.innerHTML += navBar(h);

  var q = $('#q');
  if (q && ui.q) q.value = ui.q;
  if (keepScroll) window.scrollTo(0, oldScroll);
}

function navBar(h){
  var on = function(p){ return h === p ? ' on' : ''; };
  var u = me();
  var items = [
    '<a href="#/" class="'+on('/').trim()+'"><span class="ic">'+ico('home')+'</span>首页</a>',
    '<a href="#/publish" class="'+on('/publish').trim()+'"><span class="ic">'+ico('plus')+'</span>发布</a>',
    '<a href="#/favs" class="'+on('/favs').trim()+'"><span class="ic">'+ico('heart')+'</span>收藏</a>',
    u
      ? '<a href="#/mine" class="'+on('/mine').trim()+'"><span class="ic">'+ico('user')+'</span>我的</a>'
      : '<a href="#/login" class="'+(h==='/login'?' on':'')+'"><span class="ic">'+ico('user')+'</span>登录</a>'
  ];
  if (isAdmin()) items.push('<a href="#/admin" class="'+on('/admin').trim()+'"><span class="ic">'+ico('chart')+'</span>数据</a>');
  return '<nav class="nav">' + items.join('') + '</nav>';
}

/* ---------- 剪贴板 / 下载 ---------- */
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast('已复制'); }, function(){ fallbackCopy(t); });
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}
function download(name, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function toCsv(rows){
  return '\ufeff' + rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');
}

/* 首屏基线：让后台第一次打开就像"已经跑了两周"，且漏斗各步同源、不自相矛盾 */
function injectBaseline(){
  if (state.events.length) return;
  var now = Date.now();
  var chs = ['朋友圈','表白墙','宿舍群','地推','direct'];
  var pickCh = function(){ return chs[Math.floor(Math.random()*chs.length)]; };
  var pickU = function(){ return 'demo_u' + (1 + Math.floor(Math.random()*60)); };
  var when = function(){ return now - Math.floor(Math.pow(Math.random(), 1.5) * 13 * 86400e3); };

  if (!Object.keys(state.favs).length){
    for (var f=0; f<14; f++){
      var uid = 'demo_u' + (1 + Math.floor(Math.random()*40));
      var iid = 'd' + (1 + Math.floor(Math.random()*10));
      var arr = state.favs[uid] || (state.favs[uid] = []);
      if (arr.indexOf(iid) < 0) arr.push(iid);
    }
    saveFavs();
  }

  state.items.forEach(function(it){
    var views = it.views || 20, contacts = it.contacts || 3;
    var home = Math.round(views * (1.5 + Math.random()*1.1));
    var i;
    for (i=0;i<home;i++) state.events.push({t:when(), ev:'view_home', id:'', uid:pickU(), ch:pickCh(), demo:true});
    for (i=0;i<views;i++) state.events.push({t:when(), ev:'view_item', id:it.id, uid:pickU(), ch:pickCh(), demo:true});
    for (i=0;i<contacts;i++) state.events.push({t:when(), ev:'click_contact', id:it.id, uid:pickU(), ch:pickCh(), demo:true});
    state.events.push({t:it.createdAt, ev:'publish', id:it.id, uid:pickU(), ch:pickCh(), demo:true});
  });
  state.events.sort(function(a,b){ return a.t - b.t; });
  saveEvents();
}

/* ---------- 演示事件 ---------- */
function injectDemoEvents(){
  var now = Date.now();
  var chs = ['朋友圈','表白墙','宿舍群','地推','direct'];
  var evs = ['view_home','view_item','click_contact','publish','fav'];
  for (var i=0;i<60;i++){
    state.events.push({

      ch: chs[Math.floor(Math.random()*chs.length)],
      demo: true
    });
  }
  saveEvents();
}

/* ---------- 点击委托 ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  if (act === 'tab'){ ui.tab = el.getAttribute('data-v'); track('filter_tab'); render(); }
  else if (act === 'back'){ history.length > 1 ? history.back() : go('/'); }
  else if (act === 'type'){ draft.type = el.getAttribute('data-v'); render(); }
  else if (act === 'copy'){ copyText(el.getAttribute('data-v')); }
  else if (act === 'auth-mode'){ ui.authMode = el.getAttribute('data-v'); render(); }
  else if (act === 'logout'){
    state.session = null; DB.set('session', null); track('logout');
    toast('已退出'); go('/'); render();
  }
  else if (act === 'to-admin-login'){ ui.authMode='login'; ui.next='/admin'; go('/login'); }
  else if (act === 'share'){
    var u2 = location.origin + location.pathname + '?ch=me#' + route();
    copyText(u2); track('share');
    toast('链接已复制，直接发给同学就行');
  }
  else if (act === 'fav'){
    if (!me()){ needLogin('/'); return; }
    var nowFav = toggleFav(id);
    track(nowFav ? 'fav' : 'unfav', id);
    toast(nowFav ? '已加入收藏' : '已取消收藏');
    render();
  }
  else if (act === 'contact'){
    if (!me()){ needLogin('#/item/' + id); return; }
    var it = null;
    for (var i=0;i<state.items.length;i++) if (state.items[i].id===id) it = state.items[i];
    if (!it) return;
    it.contacts = (it.contacts||0) + 1; saveItems();
    track('click_contact', id);
    toast('联系方式已复制 · 记得先自报是哪条内容');
    if (navigator.clipboard && it.contact) navigator.clipboard.writeText(it.contact).catch(function(){});
    render();
  }
  else if (act === 'needlogin'){
    needLogin('#/item/' + id);
  }
  else if (act === 'toggle-status'){
    if (!isAdmin() && !me()){ needLogin('/mine'); return; }
    for (var j=0;j<state.items.length;j++){
      if (state.items[j].id === id){
        if (state.items[j].ownerId !== state.session && !isAdmin()){ toast('只能改自己发的内容'); return; }
        state.items[j].status = state.items[j].status === 'open' ? 'done' : 'open';
        saveItems();
        track('toggle_status', id);
        toast(state.items[j].status === 'done' ? '已标记为解决' : '已重新打开');
      }
    }
    render();
  }
  else if (act === 'del'){
    if (!confirm('删除后无法恢复，确定删除这条吗？')) return;
    var target = null;
    state.items = state.items.filter(function(x){
      if (x.id === id){ target = x; return false; }
      return true;
    });
    if (!target) return;
    if (target.ownerId !== state.session && !isAdmin()){ toast('只能删自己发的内容'); return; }
    saveItems();
    for (var k in state.favs){
      var idx = state.favs[k].indexOf(id);
      if (idx >= 0) state.favs[k].splice(idx,1);
    }
    saveFavs();
    track('delete_item', id);
    toast('已删除'); go('/mine'); render();
  }
  else if (act === 'export-ev'){
    var rows = [['时间','事件','内容ID','用户','渠道']];
    state.events.forEach(function(x){
      rows.push([new Date(x.t).toLocaleString('zh-CN'), x.ev, x.id||'', x.uid, x.ch]);
    });
    download('埋点数据_'+dayKey(Date.now())+'.csv', toCsv(rows), 'text/csv;charset=utf-8');
    toast('已导出 '+state.events.length+' 条事件');
  }
  else if (act === 'export-item'){
    var r2 = [['ID','类型','标题','价格','地点','状态','浏览','联系','收藏','发布时间','发布者']];
    state.items.forEach(function(x){
      r2.push([x.id, x.type==='lost'?'失物招领':(x.type==='pin'?'拼单':'二手'), x.title, x.price||'', x.area||'',
        x.status==='open'?'进行中':'已解决', x.views||0, x.contacts||0, favCount(x.id),
        new Date(x.createdAt).toLocaleString('zh-CN'), x.author||'']);
    });
    download('内容数据_'+dayKey(Date.now())+'.csv', toCsv(r2), 'text/csv;charset=utf-8');
    toast('已导出 '+state.items.length+' 条内容');
  }
  else if (act === 'seed-demo'){
    injectBaseline(); toast('历史事件已按内容数据重算'); render();
  }
  else if (act === 'clear-demo'){
    if (!confirm('会清空全部内容和全部事件，清空后不可恢复。继续吗？')) return;
    state.events = [];
    state.items = [];
    state.favs = {};
    saveEvents(); saveItems(); saveFavs();
    toast('已清空全部内容'); go('/'); render();
  }
});

/* ---------- 图片 ---------- */
document.addEventListener('change', function(e){
  var inp = e.target;
  if (!inp || inp.type !== 'file') return;
  var f = inp.files && inp.files[0];
  if (!f) return;
  var idx = inp.getAttribute('data-i');
  compress(f, function(dataUrl){
    if (idx != null) draft.imgs[Number(idx)] = dataUrl;
    else draft.imgs.push(dataUrl);
    render();
  });
});

function compress(file, cb){
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function(){
    var max = 720, w = img.width, h = img.height;
    if (w > h && w > max){ h = Math.round(h*max/w); w = max; }
    else if (h >= w && h > max){ w = Math.round(w*max/h); h = max; }
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    cb(c.toDataURL('image/jpeg', 0.75));
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast('图片读取失败'); };
  img.src = url;
}

/* ---------- 发布表单 ---------- */
document.addEventListener('submit', function(e){
  if (!e.target || e.target.id !== 'pub') return;
  e.preventDefault();
  var u = me();
  if (!u){ needLogin('/publish'); return; }
  var fd = new FormData(e.target);
  var title = String(fd.get('title')||'').trim();
  var desc = String(fd.get('desc')||'').trim();
  if (title.length < 4){ toast('标题至少写 4 个字'); return; }
  if (desc.length < 5){ toast('详情再写两句，方便别人判断'); return; }
  var item = {
    id: 'i_' + Date.now().toString(36),
    type: draft.type, title: title, desc: desc,
    price: String(fd.get('price')||'').trim(),
    area: String(fd.get('area')||'').trim(),
    contact: String(fd.get('contact')||'').trim(),
    createdAt: Date.now(),
    views: 0, contacts: 0, status: 'open',
    author: u.nick, ownerId: u.id,
    imgs: draft.imgs.slice()
  };
  if (draft.type === 'pin'){
    item.need = Math.max(2, parseInt(fd.get('need'), 10) || 3);
    item.joined = 1;
    item.untilText = String(fd.get('until')||'').trim();
    item.until = Date.now() + 12 * 3600e3;
  }
  state.items.push(item);
  saveItems();
  track('publish', item.id);
  draft = { type:'lost', imgs:[] };
  toast('发布成功');
  go('/item/' + item.id);
});

/* ---------- 登录 / 注册 ---------- */
document.addEventListener('submit', function(e){
  if (!e.target || e.target.id !== 'auth') return;
  e.preventDefault();
  var fd = new FormData(e.target);
  var nick = String(fd.get('nick')||'').trim();
  var sid = String(fd.get('sid')||'').trim();
  var pass = String(fd.get('pass')||'');
  var pass2 = String(fd.get('pass2')||'');
  var login = ui.authMode === 'login';

  if (nick.length < 2){ toast('昵称至少 2 个字'); return; }
  if (pass.length < 6){ toast('密码至少 6 位'); return; }

  if (login){
    var hit = null;
    for (var i=0;i<state.users.length;i++){
      if ((state.users[i].nick === nick || state.users[i].sid === nick) && state.users[i].pass === hash(pass)) hit = state.users[i];
    }
    if (!hit){ toast('昵称/学号或密码不对'); return; }
    state.session = hit.id;
    DB.set('session', hit.id);
    track('login');
    toast('欢迎回来，' + hit.nick);
    var nx = ui.next || '/';
    ui.next = '/';
    go(nx); render();
  } else {
    if (!/^\d{8,12}$/.test(sid)){ toast('学号要填 8–12 位数字'); return; }
    if (pass !== pass2){ toast('两次密码不一致'); return; }
    for (var j=0;j<state.users.length;j++){
      if (state.users[j].nick === nick){ toast('这个昵称已经有人用了'); return; }
      if (state.users[j].sid === sid){ toast('这个学号已经注册过，直接登录就行'); return; }
    }
    var nu = { id:'u_'+Date.now().toString(36), nick:nick, sid:sid, pass:hash(pass), role:'user', createdAt:Date.now() };
    state.users.push(nu);
    saveUsers();
    state.session = nu.id;
    DB.set('session', nu.id);
    track('register');
    toast('注册成功，已登录');
    var nx2 = ui.next || '/';
    ui.next = '/';
    go(nx2); render();
  }
});

else injectBaseline();

render();
